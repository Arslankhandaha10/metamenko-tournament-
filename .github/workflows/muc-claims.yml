name: MUC Claim Processor

# Runs every 5 minutes to process pending_verify claim submissions. The job
# pulls up to 50 pending claims per run, runs on-chain ownership verification,
# and atomically grants / rejects each one. If the indexer is briefly down, the
# claim stays pending_verify and is retried on the next tick.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: muc-coordinator
        run: npm ci --no-audit --no-fund

      - name: Run claim processor
        working-directory: muc-coordinator
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run claims-tick
