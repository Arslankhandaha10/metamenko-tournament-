name: MUC Cycle Tick

# Runs every 10 minutes. The tick is idempotent — if the previous cycle is
# already finalized, it exits early without writes. Increase the cron
# frequency for testing-mode (sub-day cycles); decrease for production.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # NOTE: The coordinator lives inside a `~` suffixed folder so Unity
      # ignores it during asset import (otherwise Unity would treat node_modules
      # as game assets). The `~` is part of the directory name.
      - name: Install deps
        working-directory: muc-coordinator
        run: npm ci --no-audit --no-fund

      - name: Run cycle tick
        working-directory: muc-coordinator
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run tick
